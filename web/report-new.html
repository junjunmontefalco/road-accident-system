<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23272B">
  <title>Report an accident · RoadReport</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <!-- FR-03, FR-04, FR-05 report form. Owner: Jan Russel -->
  <main id="page" hidden>
    <div class="form-page">
      <h1 class="h3 mb-3">Report an accident</h1>
      <ol class="stepper" id="stepper" aria-label="Progress"></ol>
      <div id="message"></div>
      <form id="report-form" novalidate>
        <div class="panel">
          <section data-step="0">
            <div class="row g-3">
              <div class="col-sm-6">
                <label class="form-label" for="accident_date">Date of the accident</label>
                <input id="accident_date" name="accident_date" type="date" class="form-control" required>
              </div>
              <div class="col-sm-6">
                <label class="form-label" for="accident_time">Time (approximate is fine)</label>
                <input id="accident_time" name="accident_time" type="time" class="form-control" required>
              </div>
              <div class="col-sm-6">
                <label class="form-label" for="accident_type_id">Type of accident</label>
                <select id="accident_type_id" name="accident_type_id" class="form-select" required><option value="">Choose…</option></select>
              </div>
              <div class="col-sm-6">
                <span class="form-label d-block" id="injury-label">Injuries or fatalities</span>
                <div class="choice-row" id="injury" role="radiogroup" aria-labelledby="injury-label"></div>
              </div>
            </div>
            <fieldset class="mt-4">
              <legend class="form-label fs-6">Vehicles involved</legend>
              <div id="vehicle-rows"></div>
              <button type="button" class="btn btn-link btn-sm px-0" id="add-vehicle">Add another vehicle</button>
            </fieldset>
            <div class="mt-3">
              <label class="form-label" for="description">What happened?</label>
              <textarea id="description" name="description" rows="4" class="form-control"
                placeholder="Example: A tricycle was hit from behind while turning into the market road."></textarea>
            </div>
          </section>

          <section data-step="1" hidden>
            <div id="map-picker"></div>
            <input type="hidden" name="latitude">
            <div class="row g-3 mt-1">
              <div class="col-12">
                <label class="form-label" for="location_text">Road, street or landmark</label>
                <input id="location_text" name="location_text" class="form-control" placeholder="Example: MacArthur Highway in front of the public market">
              </div>
              <div class="col-sm-6">
                <label class="form-label" for="barangay">Barangay</label>
                <input id="barangay" name="barangay" class="form-control">
              </div>
              <div class="col-sm-6">
                <label class="form-label" for="municipality">City or municipality</label>
                <input id="municipality" name="municipality" class="form-control" list="towns">
                <datalist id="towns"></datalist>
              </div>
            </div>
          </section>

          <section data-step="2" hidden>
            <div id="photo-picker"></div>
            <div class="small text-danger mt-1" id="photo-error"></div>
            <input type="hidden" name="photos">
            <h2 class="h6 mt-4">Check before sending</h2>
            <dl class="review-list" id="review"></dl>
          </section>
        </div>
        <div class="d-flex justify-content-between mt-3">
          <button type="button" class="btn btn-outline-secondary" id="back">Back</button>
          <button type="button" class="btn btn-guide" id="next">Next</button>
          <button type="button" class="btn btn-report" id="send" hidden>Send report</button>
        </div>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/pages/report-new.js"></script>
</body>
</html>
