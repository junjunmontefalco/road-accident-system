<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23272B">
  <title>Home · RoadReport</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <!-- Reporter home. Owner: Jan Russel -->
  <main id="page" hidden>
    <div class="row g-4">
      <div class="col-lg-7">
        <h1 class="h3 mb-3">Hi <span id="first-name"></span></h1>
        <a href="report-new.html" class="report-sign">
          <span class="report-sign-title">Report an accident</span>
          <span class="report-sign-sub">Takes about 3 minutes. Photos are optional.</span>
        </a>
        <div id="needs-info"></div>
        <div class="d-flex justify-content-between align-items-baseline mt-4 mb-2">
          <h2 class="h5 mb-0">Your latest reports</h2>
          <a href="my-reports.html" class="small">See all</a>
        </div>
        <ul class="list-plain" id="latest"><li class="text-secondary">Loading…</li></ul>
      </div>
      <aside class="col-lg-5">
        <section class="panel">
          <h2 class="h6">Emergency contacts</h2>
          <p class="small text-secondary">Call first if someone is hurt.</p>
          <ul class="list-plain mb-0" id="contacts"></ul>
        </section>
      </aside>
    </div>
  </main>
  <script type="module" src="js/pages/home.js"></script>
</body>
</html>
