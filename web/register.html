<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23272B">
  <title>Create an account · RoadReport</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <!-- FR-01 registration (creates a reporter account). Owner: Jan Russel -->
  <div class="auth-page">
    <form class="auth-card" id="register-form" novalidate>
      <a href="index.html" class="text-decoration-none d-inline-block mb-3"><span class="brand "><svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><rect x="10" y="10" width="44" height="44" rx="6" transform="rotate(45 32 32)" fill="#F2B705" stroke="#23272B" stroke-width="4"/><rect x="29" y="18" width="6" height="18" rx="3" fill="#23272B"/><circle cx="32" cy="43" r="3.5" fill="#23272B"/></svg><span>RoadReport</span></span></a>
      <h1 class="h4 mb-1">Create an account</h1>
      <p class="small text-secondary mb-3">You need an account so you can track your reports.</p>
      <div id="message"></div>
      <div class="mb-3"><label class="form-label" for="full_name">Full name</label>
        <input id="full_name" name="full_name" class="form-control" autocomplete="name" required></div>
      <div class="mb-3"><label class="form-label" for="email">Email</label>
        <input id="email" name="email" type="email" class="form-control" autocomplete="email" required></div>
      <div class="mb-3"><label class="form-label" for="phone">Mobile number (optional)</label>
        <input id="phone" name="phone" type="tel" class="form-control" placeholder="09XXXXXXXXX" autocomplete="tel"></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label>
        <input id="password" name="password" type="password" class="form-control" autocomplete="new-password" required>
        <div class="form-text">At least 8 characters with letters and numbers.</div></div>
      <div class="mb-3"><label class="form-label" for="password_confirmation">Confirm password</label>
        <input id="password_confirmation" name="password_confirmation" type="password" class="form-control" autocomplete="new-password" required></div>
      <button class="btn btn-guide w-100" type="submit">Create account</button>
      <p class="small mt-3 mb-0">Already registered? <a href="login.html">Log in</a></p>
    </form>
  </div>
  <script type="module" src="js/pages/register.js"></script>
</body>
</html>
